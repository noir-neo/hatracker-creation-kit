name: Release Publish

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

env:
  PKG_DIR: Packages/HatrackerCreationKit

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Resolve tag from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          TAG="${HEAD_REF#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          ## Installation

          Add the following git URL via Unity Package Manager ("Add package from git URL..."):

          \`\`\`
          https://github.com/${REPO}.git?path=${PKG_DIR}#${TAG}
          \`\`\`
          EOF
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --generate-notes
